function quickScore(b){
  const t=b.toLowerCase();
  if(["cadillac scor","bottas podium","perez podium","lindblad win","audi podium","formation lap retire","disqualif","bortoleto win","team principal fire","banned from","audi win"].some(k=>t.includes(k)))return 5;
  const v4=["crash","retire","dnf","penalty","rain","safety car lap 1","blames team","failure","bleep","red flag","collision","brake fail","active aero fail","pit lane fire"];
  if(v4.filter(k=>t.includes(k)).length>=2)return 5;
  if(v4.some(k=>t.includes(k)))return 4;
  if(["norris champion","mclaren 1-2","safety car deployed"].some(k=>t.includes(k)))return 1;
  const v2=["mercedes win","russell win","norris win","verstappen win","hamilton win","podium","pole position","fastest lap","points finish"];
  if(v2.filter(k=>t.includes(k)).length>=2)return 1;
  if(v2.some(k=>t.includes(k)))return 2;
  return 3;
}

async function callClaude(prompt,search=false){
  const body={model:"claude-sonnet-4-20250514",max_tokens:2000,messages:[{role:"user",content:prompt}]};
  if(search)body.tools=[{type:"web_search_20250305",name:"web_search"}];
  const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
  const d=await r.json();
  return(d.content||[]).filter(c=>c.type==="text").map(c=>c.text).join("");
}

function parseJ(txt){
  try{
    const a=txt.indexOf("["),o=txt.indexOf("{");
    const s=(a>=0&&(o<0||a<o))?a:o;
    const z=txt.lastIndexOf("}")>txt.lastIndexOf("]")?txt.lastIndexOf("}"):txt.lastIndexOf("]");
    if(s<0||z<0)return null;
    return JSON.parse(txt.slice(s,z+1));
  }catch{return null;}
}

function useCountdown(target){
  const[t,setT]=useState({});
  useEffect(()=>{
    const calc=()=>{
      const d=target-Date.now();
      if(d<=0)return setT({expired:true});
      setT({d:Math.floor(d/86400000),h:Math.floor(d%86400000/3600000),m:Math.floor(d%3600000/60000),s:Math.floor(d%60000/1000),expired:false});
    };
    calc();const id=setInterval(calc,1000);return()=>clearInterval(id);
  },[target]);
  return t;
}

    )
  );
}
